  RHW, 도로 및 일방통행 도로의 드래그할 수 있는 지하철 기반 유연한FLEX 지하도로(FLUPs) 출입구, URoad 시작 조각 및 여러 네트워크의 유연한FLEX 상부교차(overcrossings)가 들어있습니다.

  출입구를 먼저 건설하고, 지원하는 RHW 네트워크(적혀있음)로 재정의합니다. URoad 시작 조각을 설치하고, 시작 조각을 통과하도록 지하철 기반 도로를 그어서 터널을 연결합니다.

  지상 네트워크가 지하도로를 가로지를 때에는 상부교차 조각을 지하도로 위에 설치합니다.
