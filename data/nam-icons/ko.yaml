  RHW 유연한FLEX 이웃 연결기(FLEX-NC)

  도시 가장자리 타일에 설치하고 적절한 재정의 네트워크를 그으세요.

  중간에 빈 땅이 있다면 RHW 투명 루프 연결기를 빈 땅에 설치하세요.
2026960b-6a231eaa-60154f00: 알렉상드르 3세 다리는 센강을 가로지르는 아치교로 샹젤리제 지구와 앵발리드 및 에펠탑 지구를
  연결하며 파리에서 가장 화려하고 호화로운 다리로 널리 알려져 있다. 활기찬 아르누보 램프, 케루빔, 님프, 그리고 날개 달린 말이 양쪽 끝에
  있는 이 다리는 1896년에서 1900년 사이에 지어졌다. 이 다리는 1892년 프랑스-러시아 동맹을 체결한 차르 알렉산드르 3세의 이름을
  따서 명명되었다. 그의 아들 니콜라스 2세가 1896년 10월에 주춧돌을 놓았다. 다리의 스타일은 오른쪽 강둑으로 이어지는 그랑팔레의
  스타일을 반영한다.
