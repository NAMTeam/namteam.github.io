2026960b-6a231eaa-60154f00: "Le Pont Alexandre III, pont en arc sur la Seine,
  reliant le 7e et le 8e arr. de Paris. Pont le plus orné et le plus extravagant
  de la ville : lampes Art Nouveau exubérantes, chérubins, nymphes et chevaux
  ailés à chaque extrémité. Construit entre 1896 et 1900. Il porte le nom du
  tsar Alexandre III, qui avait conclu l'alliance franco-russe en 1892. Son fils
  Nicolas II posa la première pierre en octobre 1896."
