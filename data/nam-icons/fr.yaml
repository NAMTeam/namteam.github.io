2026960b-123006aa-6a475600: |-
  Contient des voies d'accès, entrées et sorties, pour autoroutes (RHW), routes et routes à sens unique, pour les passages inférieurs FLEX (FLUP) basés sur le métro, les Pièces-Initiales URoad (souterrain) et les passages supérieurs FLEX pour divers réseaux.

  Construisez d'abord les accès, remplacez-les par le réseau RHW approprié (si vous le souhaitez), placez les Pièces-Initiales URoad, et faites glisser l'outil métro à travers la pièce-initiale et connectez les tunnels. 

  Placez les pièces de franchissement au-dessus du tracé souterrain chaque fois qu'un réseau de surface se croise, afin de permettre au trafic souterrain de passer.
