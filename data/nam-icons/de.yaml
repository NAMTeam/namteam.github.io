2026960b-6a231ea4-2a504ba1: |-
  <p>
  Hoppla! Es scheint, als hätten unsere Verkehrsingenieure den falschen Weg eingeschlagen. Die vorliegenden Daten zeigen bizarre Straßenmuster und verwirrende Kreuzungen, die eher wie moderne Kunstwerke aussehen statt funktionaler Wege – ein Beweis dafür, dass mit den falschen Infos selbst die besten Baumeister vom Pfad abkommen:
  </p><p>
  Ihr Plugins-Ordner enthält nicht die richtige <u>NAM-DLL</u>-Datei.</p><p>
  Benötigte NAM-DLL-Version: <u>#nam_dll_version_expected#</u>
  <br>
  Installierte NAM-DLL-Version: <u>#nam_dll_version or 'nicht installiert'#</u>
  </p>
