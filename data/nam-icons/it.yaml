2026960b-6a231eaa-60154f00: Il Pont Alexandre III è un ponte ad arco che
  attraversa la Senna, collegando il quartiere degli Champs-Élysées con quello
  degli Invalides e della Torre Eiffel, ed è considerato il ponte più ornato e
  stravagante di Parigi. Il ponte, con le sue esuberanti lampade Art Nouveau, i
  cherubini, le ninfe e i cavalli alati alle due estremità, fu costruito tra il
  1896 e il 1900. Prende il nome dallo zar Alessandro III, che aveva concluso
  l'alleanza franco-russa nel 1892. Suo figlio Nicola II pose la prima pietra
  nell'ottobre 1896. Lo stile del ponte riflette quello del Grand Palais, al
  quale conduce sulla riva destra.
