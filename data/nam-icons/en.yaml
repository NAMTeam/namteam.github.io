2026960b-6a231eaa-60154f00: Pont Alexandre III is an arch bridge that spans the
  Seine, connecting the Champs-Élysées quarter and the Invalides and Eiffel
  Tower quarter, widely regarded as the most ornate, extravagant bridge in
  Paris. The bridge, with its exuberant Art Nouveau lamps, cherubs, nymphs and
  winged horses at either end, was built between 1896 and 1900. It is named
  after Tsar Alexander III, who had concluded the Franco-Russian Alliance in
  1892. His son Nicholas II laid the foundation stone in October 1896. The style
  of the bridge reflects that of the Grand Palais, to which it leads on the
  right bank.
