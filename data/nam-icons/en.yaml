  Based on the original design of the Dresden Hauptbahnhof, Germany.
  This station mixes a central hall at ground level plus four L1 (7.5m) elevated rail platforms at the sides. In-game you will need to drag the elevated rail tracks under the overhangs at the sides. In addition, it has an overhang at the front.

  Lot Size: 4x13 (with overhangs: 8x20. The model expanding 2 tiles on both of the sides and another 7 tiles ahead from the lot)
  Monthly Cost: #m:EA54D286#
  Bulldoze Cost: #m:099AFACD#
  Power Consumption: #d:27812854#
  Water Consumption: #d:C8ED2D84#
  Passenger Capacity: #d:4aa60ebc#
  Jobs: 534

  It supports L1 Hybrid Railway (HRW) traffic to get-on/off from the trains on the overhangs closer to the building and/or it also supports L1 E-RRW and/or L1 BRT (single tile L1 road networks, OWR2 and RHW). There are four rail tracks at the back on ground level which terminate in the station building. It has a Bus Stop and Subway Station as well.

  Created by Debussyman
