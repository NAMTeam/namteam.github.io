2026960b-123006aa-6a47ce00: |-
  Para construir secciones elevadas y transiciones de altura del ferrocarril híbrido (HRW). El ferrocarril híbrido permite el tráfico de trenes normales y de alta velocidad (monorriel).

  Se construye usando secciones HRW a nivel de suelo y luego conectándolos al lado elevado de las transiciones de altura, o a otras secciones ya elevadas.

  Las piezas se giran usando las teclas Inicio y Fin; las teclas Tab y Shift+Tab (o Ctrl+Tab y Ctrl+Shift+Tab en macOS) cambian la pieza a usar. Cuando el cursor esté en verde, se puede colocar haciendo clic.
