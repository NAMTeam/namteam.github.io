2026960b-6a231eaa-60154f00: |-
  Puente Alejandro III.

  Es un puente de arco sobre el Sena, conectando los Campos Elíseos con el sector de Les Invalides (y la Torre Eiffel). Es considerado el más ornado y extravagante de los puentes parisinos, con exhuberantes lámparas, querubines, nínfas y corceles alados de estilo Art Nouveau a cada extremo, reflejando el estilo del Grand Palais, ubicado a su ribera derecha. Se construyó entre 1896 y 1900 y recibe su nombre del zar ruso Alejandro III, que firmó la alianza Franco-Rusa de 1892. Su hijo, Nicolás II, puso la primera piedra del puente en octubre de 1896.
