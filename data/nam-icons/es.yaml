  Pont Notre Dame JENXPARIS.

  El Puente de Nuestra Señora de París cruza el río Sena, conectando el Muelle de Gesvres en la rivera derecha, con el Muelle de la Corse en la Isla de la Ciudad. El puente es conocido como el "más antiguo" de París, en el sentido de que, en su ubicación, ha existido un puente desde los inicios de la ciudad; no obstante, el puente más antiguo todavía en pie en París es el Puente Nuevo.
